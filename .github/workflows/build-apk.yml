name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Yuzono anime-extensions
        uses: actions/checkout@v4
        with:
          repository: yuzono/anime-extensions
          path: anime-extensions

      - name: Load only Re:ANIME
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("anime-extensions/settings.gradle.kts")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped == "loadAllIndividualExtensions()":
                  out.append("// " + line.lstrip())
              elif stripped == '// loadIndividualExtension("all", "jellyfin")':
                  out.append('loadIndividualExtension("en", "reanime")\n')
              else:
                  out.append(line)
          text = "".join(out)
          if 'loadIndividualExtension("en", "reanime")' not in text:
              raise SystemExit("failed to enable reanime module")
          p.write_text(text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: anime-extensions
        run: ./gradlew :src:en:reanime:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find anime-extensions -name "*.apk" -path "*/reanime/*" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reanime-aniyomi-extension
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Re:ANIME official module ${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: false
          body: |
            Official Yuzono Re:ANIME extension APK.
            Prefer installing from the Yuzono repo in Aniyomi/Anikku.
