name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout Yuzono anime-extensions
        uses: actions/checkout@v4
        with:
          repository: yuzono/anime-extensions
          path: anime-extensions

      - name: Copy Re:ANIME module
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p anime-extensions/src/en/reanime
          cp -a overlay/src/en/reanime/. anime-extensions/src/en/reanime/
          python3 overlay/.github/scripts/make_icon.py anime-extensions/src/en/reanime/res

      - name: Load only this extension
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("anime-extensions/settings.gradle.kts")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped == "loadAllIndividualExtensions()":
                  out.append("// " + line.lstrip())
              elif stripped == '// loadIndividualExtension("all", "jellyfin")':
                  out.append('loadIndividualExtension("en", "reanime")\n')
              else:
                  out.append(line)
          text = "".join(out)
          if 'loadIndividualExtension("en", "reanime")' not in text:
              raise SystemExit("failed to enable reanime module")
          p.write_text(text)
          print("--- settings snippet ---")
          print("".join(out[30:45]))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: List projects
        working-directory: anime-extensions
        run: ./gradlew projects --no-daemon | tail -50

      - name: Build debug APK
        working-directory: anime-extensions
        run: ./gradlew :src:en:reanime:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find anime-extensions -name "*.apk" -path "*/reanime/*" -exec cp {} dist/ \;
          find anime-extensions -name "*.apk" | tee apk-list.txt
          cp apk-list.txt dist/ || true
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reanime-aniyomi-extension
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Re:ANIME extension ${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: false
          body: |
            Sideload this APK into Aniyomi or Anikku.
            Trust the extension after install.
            Browse / search / episodes work. Playback is not implemented yet.
